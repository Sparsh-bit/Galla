<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Galla setup</title>
<style>
  body { font: 15px -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; color: #032048; background: radial-gradient(ellipse at 70% 15%, #d9e8f5 0, transparent 50%), #f2f7fc; -webkit-app-region: drag }
  main { width: min(440px, 90vw); background: #fff; padding: 32px; border-radius: 22px; box-shadow: 0 30px 70px -40px rgb(3 32 72 / 0.35); -webkit-app-region: no-drag; animation: rise .6s cubic-bezier(.32,.72,0,1) both }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(6px) } }
  h1 { margin: 0 0 4px; font-size: 30px; font-weight: 800; letter-spacing: -.05em } h1 span { color: #047348 } p { color: #586a82; margin: 0 0 20px }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; border: 1px solid #d7e2ee; border-radius: 12px }
  button { margin-top: 14px; width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(180deg, #058252, #047348); border: 0; border-radius: 999px; cursor: pointer }
  #err { color: #c0262d; min-height: 1.2em; margin-top: 10px }
</style>
<main>
  <h1>galla<span>.</span></h1>
  <p>Enter the address of your Galla server, for example <b>https://galla.yourshop.com</b> or <b>http://localhost:3000</b>.</p>
  <form id="f"><input id="u" type="url" required placeholder="https://" autofocus><button>Connect</button><div id="err" role="alert"></div></form>
</main>
<script>
  const u = document.getElementById("u"), err = document.getElementById("err");
  window.gallaSetup.current().then((v) => { if (v) u.value = v; });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const r = await window.gallaSetup.save(u.value.trim());
    if (r && r.error) err.textContent = r.error;
  });
</script>
