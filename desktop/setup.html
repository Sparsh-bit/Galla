<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Galla setup</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f6f6fb; color: #1b1b2f }
  main { width: min(440px, 90vw); background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 8px 30px #4a3fd622 }
  h1 { margin: 0 0 4px; color: #4a3fd6 } p { color: #666; margin: 0 0 20px }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; border: 1px solid #ccd; border-radius: 8px }
  button { margin-top: 14px; width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: #4a3fd6; border: 0; border-radius: 8px; cursor: pointer }
  #err { color: #c0262d; min-height: 1.2em; margin-top: 10px }
</style>
<main>
  <h1>Galla</h1>
  <p>Enter the address of your Galla server, for example <b>https://galla.yourshop.com</b> or <b>http://localhost:3000</b>.</p>
  <form id="f"><input id="u" type="url" required placeholder="https://" autofocus><button>Connect</button><div id="err" role="alert"></div></form>
</main>
<script>
  const u = document.getElementById("u"), err = document.getElementById("err");
  window.gallaSetup.current().then((v) => { if (v) u.value = v; });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const r = await window.gallaSetup.save(u.value.trim());
    if (r && r.error) err.textContent = r.error;
  });
</script>
