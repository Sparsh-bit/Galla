name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bake in the Galla server address
        if: vars.GALLA_URL != ''
        shell: bash
        run: node -e "require('fs').writeFileSync('app-config.json', JSON.stringify({ url: process.env.GALLA_URL }))"
        env:
          GALLA_URL: ${{ vars.GALLA_URL }}
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds; add signing secrets to sign
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: galla-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
